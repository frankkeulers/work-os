<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Muninn motion sketches</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3F3A9E}a:hover{color:#2B2775}

/* A2 · Needs you: head snaps up, eye pops orange, the raven calls, rings ripple out */
.nd-head{transform-box:view-box;transform-origin:24px 58px;animation:ndHead 3.6s cubic-bezier(.3,1.6,.5,1) infinite}
@keyframes ndHead{0%,18%{transform:rotate(0deg)}24%{transform:rotate(-11deg)}28%{transform:rotate(-6deg)}32%{transform:rotate(-9deg)}36%,70%{transform:rotate(-8deg)}82%,100%{transform:rotate(0deg)}}
.nd-eye{transform-box:fill-box;transform-origin:center;animation:ndEye 3.6s ease-out infinite}
@keyframes ndEye{0%,20%{fill:#14171C;transform:scale(1)}25%{fill:#C2410C;transform:scale(1.9)}31%,72%{fill:#C2410C;transform:scale(1)}84%,100%{fill:#14171C;transform:scale(1)}}
.nd-ring{transform-box:fill-box;transform-origin:center;opacity:0;animation:ndRing 3.6s ease-out infinite}
.nd-ring2{animation-delay:.28s}
@keyframes ndRing{0%,22%{transform:scale(1);opacity:0}25%{opacity:1}55%,100%{transform:scale(6);opacity:0}}
.nd-call{stroke-dasharray:1;stroke-dashoffset:1;opacity:0;animation:ndCall 3.6s ease-out infinite}
.nd-call2{animation-delay:.06s}.nd-call3{animation-delay:.12s}
@keyframes ndCall{0%,24%{stroke-dashoffset:1;opacity:0}27%{opacity:1}33%{stroke-dashoffset:0;opacity:1}46%,100%{stroke-dashoffset:0;opacity:0}}

/* A3 · Checking sources: looks, hops, turns, looks the other way */
.ck-bird{transform-box:view-box;transform-origin:34px 54px;animation:ckHop 4.8s ease-in-out infinite}
@keyframes ckHop{
0%{transform:translate(0px,0px) scale(1,1)}
30%{transform:translate(0px,0px) scale(1,1)}
35%{transform:translate(0px,0px) scale(1.06,.86)}
42%{transform:translate(0px,-10px) scale(-1,1.07)}
48%{transform:translate(0px,0px) scale(-1.07,.86)}
53%{transform:translate(0px,0px) scale(-1,1)}
80%{transform:translate(0px,0px) scale(-1,1)}
85%{transform:translate(0px,0px) scale(-1.06,.86)}
92%{transform:translate(0px,-10px) scale(1,1.07)}
97%{transform:translate(0px,0px) scale(1.07,.88)}
100%{transform:translate(0px,0px) scale(1,1)}}
.ck-perch{transform-box:view-box;transform-origin:34px 55px;animation:ckPerch 4.8s ease-out infinite}
@keyframes ckPerch{0%,46%{transform:translateY(0)}49%{transform:translateY(1.6px)}53%,95%{transform:translateY(0)}98%{transform:translateY(1.6px)}100%{transform:translateY(0)}}
.ck-wave{opacity:0;animation:ckWave 1.2s ease-out infinite}
.ck-wave2{animation-delay:.18s}.ck-wave3{animation-delay:.36s}
@keyframes ckWave{0%{opacity:0}25%{opacity:1}70%,100%{opacity:0}}
.ck-waves{animation:ckWaves 4.8s linear infinite}
@keyframes ckWaves{0%,3%{opacity:0}6%,30%{opacity:1}33%,55%{opacity:0}58%,80%{opacity:1}83%,100%{opacity:0}}
.ck-blink{transform-box:fill-box;transform-origin:center;animation:ckBlink 4.8s linear infinite}
@keyframes ckBlink{0%,18%,21%,66%,69%,100%{transform:scaleY(1)}19.5%,67.5%{transform:scaleY(.1)}}

/* A2 · Filed to memory: a note arcs in, the raven catches it, the eye turns teal, a tick lands */
.fl-card{transform-box:view-box;transform-origin:0px 0px;opacity:0;animation:flCard 4s cubic-bezier(.45,0,.55,1) infinite}
@keyframes flCard{
0%{transform:translate(-4px,10px) rotate(-14deg) scale(1);opacity:0}
6%{opacity:1}
18%{transform:translate(14px,-2px) rotate(-4deg) scale(1);opacity:1}
30%{transform:translate(38px,0px) rotate(10deg) scale(.9);opacity:1}
38%{transform:translate(57px,27px) rotate(24deg) scale(.3);opacity:1}
40%,100%{transform:translate(58px,29px) rotate(24deg) scale(0);opacity:0}}
.fl-head{transform-box:view-box;transform-origin:24px 58px;animation:flHead 4s cubic-bezier(.3,1.5,.5,1) infinite}
@keyframes flHead{0%,30%{transform:rotate(0deg)}36%{transform:rotate(-7deg)}41%{transform:rotate(5deg)}47%{transform:rotate(-2deg)}53%,100%{transform:rotate(0deg)}}
.fl-eye{transform-box:fill-box;transform-origin:center;animation:flEye 4s ease-out infinite}
@keyframes flEye{0%,40%{fill:#14171C;transform:scale(1)}45%{fill:#0F766E;transform:scale(1.9)}51%,76%{fill:#0F766E;transform:scale(1)}86%,100%{fill:#14171C;transform:scale(1)}}
.fl-ring{transform-box:fill-box;transform-origin:center;opacity:0;animation:flRing 4s ease-out infinite}
@keyframes flRing{0%,42%{transform:scale(1);opacity:0}45%{opacity:1}70%,100%{transform:scale(6);opacity:0}}
.fl-tick{stroke-dasharray:1;stroke-dashoffset:1;opacity:0;animation:flTick 4s ease-out infinite}
@keyframes flTick{0%,46%{stroke-dashoffset:1;opacity:0}48%{opacity:1}58%,78%{stroke-dashoffset:0;opacity:1}88%,100%{stroke-dashoffset:0;opacity:0}}

@media (prefers-reduced-motion: reduce){
.nd-head,.nd-eye,.nd-ring,.nd-call,.ck-bird,.ck-perch,.ck-wave,.ck-waves,.ck-blink,.fl-card,.fl-head,.fl-eye,.fl-ring,.fl-tick{animation:none}
}
</style>
</helmet>
<div style="width: 1040px; height: 420px; box-sizing: border-box; padding: 48px; background: #F3F4F6; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #14171C; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px">

<div style="display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 13px; font-weight: 600; color: #5B6270">A2 · Needs you</div>
<div style="height: 280px; background: #FFFFFF; border: 1px solid #E2E5EA; border-radius: 16px; display: flex; align-items: center; justify-content: center; overflow: hidden">
<svg width="230" height="218" viewBox="-4 -4 76 72" aria-label="The raven lifts its head and its eye turns orange"><g class="nd-head"><path fill="#14171C" d="M4 58 C10 44 18 30 27 22 C32 17.5 38 16 42 17.5 C49.5 19.5 55.5 23 60 28.5 C60.5 29.5 59.6 30.3 58.6 29.9 C53.5 29.2 48.5 30 43.5 31.8 C42.3 34.5 41 37.5 41 41.5 C41 48 43.5 53.5 46 58 Z"></path><circle cx="36.5" cy="22.8" r="3.1" fill="#FFFFFF"></circle><circle class="nd-ring" cx="36.5" cy="22.8" r="1.95" fill="none" stroke="#C2410C" stroke-width="0.7"></circle><circle class="nd-ring nd-ring2" cx="36.5" cy="22.8" r="1.95" fill="none" stroke="#C2410C" stroke-width="0.5"></circle><circle class="nd-eye" cx="36.5" cy="22.8" r="1.95" fill="#C2410C"></circle></g></svg>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 13px; font-weight: 600; color: #5B6270">A3 · Checking sources</div>
<div style="height: 280px; background: #FFFFFF; border: 1px solid #E2E5EA; border-radius: 16px; display: flex; align-items: center; justify-content: center; overflow: hidden">
<svg width="230" height="218" viewBox="-6 -8 80 76" aria-label="The raven looks one way, hops, turns and looks the other way"><g class="ck-bird"><path fill="#14171C" d="M62 20.5 C58 16 53 12.5 48 12 C43 11.5 39 13.5 37 17 C32 22 24 30 17 40 L6 58 L9.5 59.5 L18 51 C24 48 31 46 36 43 C42 39 45.5 33 46.5 27.5 L46 25.5 C51 24 57 22.5 62 20.5 Z"></path><path fill="none" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" d="M35.5 24 C31 30 25 38 19 46"></path><path fill="none" stroke="#14171C" stroke-width="2.4" stroke-linecap="round" d="M30.5 46 L31.5 54 M36 43 L37 54"></path><g class="ck-blink"><circle cx="43" cy="17.6" r="2.8" fill="#FFFFFF"></circle><circle cx="43" cy="17.6" r="1.75" fill="#14171C"></circle></g></g><g class="ck-perch"><rect x="18" y="53.5" width="34" height="3.4" rx="1.7" fill="#14171C"></rect></g></svg>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 13px; font-weight: 600; color: #5B6270">A2 · Filed to memory</div>
<div style="height: 280px; background: #FFFFFF; border: 1px solid #E2E5EA; border-radius: 16px; display: flex; align-items: center; justify-content: center; overflow: hidden">
<svg width="230" height="218" viewBox="-4 -4 76 72" aria-label="The raven's eye turns teal"><g><path fill="#14171C" d="M4 58 C10 44 18 30 27 22 C32 17.5 38 16 42 17.5 C49.5 19.5 55.5 23 60 28.5 C60.5 29.5 59.6 30.3 58.6 29.9 C53.5 29.2 48.5 30 43.5 31.8 C42.3 34.5 41 37.5 41 41.5 C41 48 43.5 53.5 46 58 Z"></path><circle cx="36.5" cy="22.8" r="3.1" fill="#FFFFFF"></circle><circle class="fl-ring" cx="36.5" cy="22.8" r="1.95" fill="none" stroke="#0F766E" stroke-width="0.7"></circle><circle class="fl-eye" cx="36.5" cy="22.8" r="1.95" fill="#14171C"></circle></g></svg>
</div>
</div>

</div>
</x-dc>
