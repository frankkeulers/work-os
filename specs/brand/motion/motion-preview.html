<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Muninn motion reference</title>
<style>
/* Reference implementation of the three Muninn animations. Open in a browser.
   Timings, easings and keyframes here are the source of truth for the React port (see ../../MUNINN-IDENTITY.md §6).
   Preview loops every animation; in the app each one plays once per trigger unless the spec says otherwise. */
:root{--bg:#F3F4F6;--surface:#FFFFFF;--line:#E2E5EA;--ink:#14171C;--muted:#5B6270;--mark-attention:#C2410C;--mark-filed:#0F766E;color-scheme:light}
[data-theme="dark"]{--bg:#0F1115;--surface:#1A1D24;--line:#2A2F38;--ink:#E8EAEE;--muted:#9CA3AF;--mark-attention:#F97316;--mark-filed:#2DD4BF;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;padding:32px;background:var(--bg);color:var(--ink);font:14px/1.5 "IBM Plex Sans",system-ui,sans-serif}
h1{margin:0 0 4px;font-size:22px;font-weight:600}
p{margin:0 0 24px;color:var(--muted)}
.controls{display:flex;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.controls label{display:flex;gap:6px;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;height:280px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.label{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:10px}
.ink{fill:var(--ink)}
.ink-stroke{stroke:var(--ink)}

/* ---------- Needs you (A2): 3.6s ---------- */
.nd-head{transform-box:view-box;transform-origin:24px 58px;animation:ndHead 3.6s cubic-bezier(.3,1.6,.5,1) infinite}
@keyframes ndHead{0%,18%{transform:rotate(0deg)}24%{transform:rotate(-11deg)}28%{transform:rotate(-6deg)}32%{transform:rotate(-9deg)}36%,70%{transform:rotate(-8deg)}82%,100%{transform:rotate(0deg)}}
.nd-eye{transform-box:fill-box;transform-origin:center;animation:ndEye 3.6s ease-out infinite}
@keyframes ndEye{0%,20%{fill:var(--ink);transform:scale(1)}25%{fill:var(--mark-attention);transform:scale(1.9)}31%,72%{fill:var(--mark-attention);transform:scale(1)}84%,100%{fill:var(--ink);transform:scale(1)}}
.nd-ring{transform-box:fill-box;transform-origin:center;opacity:0;stroke:var(--mark-attention);animation:ndRing 3.6s ease-out infinite}
.nd-ring2{animation-delay:.28s}
@keyframes ndRing{0%,22%{transform:scale(1);opacity:0}25%{opacity:1}55%,100%{transform:scale(6);opacity:0}}

/* ---------- Checking sources (A3): 4.8s ---------- */
.ck-bird{transform-box:view-box;transform-origin:34px 54px;animation:ckHop 4.8s ease-in-out infinite}
@keyframes ckHop{
0%{transform:translate(0px,0px) scale(1,1)}
30%{transform:translate(0px,0px) scale(1,1)}
35%{transform:translate(0px,0px) scale(1.06,.86)}
42%{transform:translate(0px,-10px) scale(-1,1.07)}
48%{transform:translate(0px,0px) scale(-1.07,.86)}
53%{transform:translate(0px,0px) scale(-1,1)}
80%{transform:translate(0px,0px) scale(-1,1)}
85%{transform:translate(0px,0px) scale(-1.06,.86)}
92%{transform:translate(0px,-10px) scale(1,1.07)}
97%{transform:translate(0px,0px) scale(1.07,.88)}
100%{transform:translate(0px,0px) scale(1,1)}}
.ck-perch{transform-box:view-box;transform-origin:34px 55px;animation:ckPerch 4.8s ease-out infinite}
@keyframes ckPerch{0%,46%{transform:translateY(0)}49%{transform:translateY(1.6px)}53%,95%{transform:translateY(0)}98%{transform:translateY(1.6px)}100%{transform:translateY(0)}}
.ck-blink{transform-box:fill-box;transform-origin:center;animation:ckBlink 4.8s linear infinite}
/* Blink: the pupil grows to fill the socket, so the eye reads as closed for a moment. */
@keyframes ckBlink{0%,18%,21%,66%,69%,100%{transform:scale(1)}19.5%,67.5%{transform:scale(1.65)}}

/* ---------- Filed to memory (A2): 4s ---------- */
.fl-eye{transform-box:fill-box;transform-origin:center;animation:flEye 4s ease-out infinite}
@keyframes flEye{0%,40%{fill:var(--ink);transform:scale(1)}45%{fill:var(--mark-filed);transform:scale(1.9)}51%,76%{fill:var(--mark-filed);transform:scale(1)}86%,100%{fill:var(--ink);transform:scale(1)}}
.fl-ring{transform-box:fill-box;transform-origin:center;opacity:0;stroke:var(--mark-filed);animation:flRing 4s ease-out infinite}
@keyframes flRing{0%,42%{transform:scale(1);opacity:0}45%{opacity:1}70%,100%{transform:scale(6);opacity:0}}

/* Reduced motion: no movement. Needs you and Filed show their end state (coloured eye). */
.reduce .nd-head,.reduce .nd-eye,.reduce .nd-ring,.reduce .ck-bird,.reduce .ck-perch,.reduce .ck-blink,.reduce .fl-eye,.reduce .fl-ring{animation:none}
.reduce .nd-eye{fill:var(--mark-attention)}.reduce .fl-eye{fill:var(--mark-filed)}
@media (prefers-reduced-motion: reduce){
.nd-head,.nd-eye,.nd-ring,.ck-bird,.ck-perch,.ck-blink,.fl-eye,.fl-ring{animation:none}
.nd-eye{fill:var(--mark-attention)}.fl-eye{fill:var(--mark-filed)}
}
</style>
</head>
<body>
<h1>Muninn motion reference</h1>
<p>Three states. Each loops here; in the app each plays once per trigger.</p>
<div class="controls">
<label><input type="checkbox" id="dark"> Dark theme</label>
<label><input type="checkbox" id="reduce"> Simulate reduced motion</label>
</div>
<div class="grid" id="grid">

<div>
<div class="label">A2 · Needs you (3.6s)</div>
<div class="tile">
<svg width="230" height="218" viewBox="-4 -4 76 72" role="img" aria-label="The raven lifts its head and its eye turns orange">
<g class="nd-head">
<path class="ink" fill-rule="evenodd" d="M4 58 C10 44 18 30 27 22 C32 17.5 38 16 42 17.5 C49.5 19.5 55.5 23 60 28.5 C60.5 29.5 59.6 30.3 58.6 29.9 C53.5 29.2 48.5 30 43.5 31.8 C42.3 34.5 41 37.5 41 41.5 C41 48 43.5 53.5 46 58 Z M39.6 22.8 A3.1 3.1 0 1 0 33.4 22.8 A3.1 3.1 0 1 0 39.6 22.8 Z"/>
<circle class="nd-ring" cx="36.5" cy="22.8" r="1.95" fill="none" stroke-width="0.7"/>
<circle class="nd-ring nd-ring2" cx="36.5" cy="22.8" r="1.95" fill="none" stroke-width="0.5"/>
<circle class="nd-eye" cx="36.5" cy="22.8" r="1.95"/>
</g>
</svg>
</div>
</div>

<div>
<div class="label">A3 · Checking sources (4.8s)</div>
<div class="tile">
<svg width="230" height="218" viewBox="-6 -8 80 76" role="img" aria-label="The raven looks one way, hops, turns and looks the other way">
<g class="ck-bird">
<path class="ink" fill-rule="evenodd" d="M62 20.5 C58 16 53 12.5 48 12 C43 11.5 39 13.5 37 17 C32 22 24 30 17 40 L6 58 L9.5 59.5 L18 51 C24 48 31 46 36 43 C42 39 45.5 33 46.5 27.5 L46 25.5 C51 24 57 22.5 62 20.5 Z M45.8 17.6 A2.8 2.8 0 1 0 40.2 17.6 A2.8 2.8 0 1 0 45.8 17.6 Z M35.1 23.6 C30.6 29.7 24.4 37.7 18.5 45.5 C18.6 46.1 19.1 46.5 19.5 46.4 C25.5 38.5 31.6 30.5 36.1 24.3 C36 23.7 35.5 23.4 35.1 23.6 Z"/>
<path class="ink-stroke" d="M30.5 46 L31.5 54 M36 43 L37 54" fill="none" stroke-width="2.4" stroke-linecap="round"/>
<circle class="ink ck-blink" cx="43" cy="17.6" r="1.75"/>
</g>
<g class="ck-perch"><rect class="ink" x="18" y="53.5" width="34" height="3.4" rx="1.7"/></g>
</svg>
</div>
</div>

<div>
<div class="label">A2 · Filed to memory (4s)</div>
<div class="tile">
<svg width="230" height="218" viewBox="-4 -4 76 72" role="img" aria-label="The raven's eye turns teal">
<path class="ink" fill-rule="evenodd" d="M4 58 C10 44 18 30 27 22 C32 17.5 38 16 42 17.5 C49.5 19.5 55.5 23 60 28.5 C60.5 29.5 59.6 30.3 58.6 29.9 C53.5 29.2 48.5 30 43.5 31.8 C42.3 34.5 41 37.5 41 41.5 C41 48 43.5 53.5 46 58 Z M39.6 22.8 A3.1 3.1 0 1 0 33.4 22.8 A3.1 3.1 0 1 0 39.6 22.8 Z"/>
<circle class="fl-ring" cx="36.5" cy="22.8" r="1.95" fill="none" stroke-width="0.7"/>
<circle class="fl-eye" cx="36.5" cy="22.8" r="1.95"/>
</svg>
</div>
</div>

</div>
<script>
document.getElementById('dark').addEventListener('change', e => { document.documentElement.dataset.theme = e.target.checked ? 'dark' : 'light'; });
document.getElementById('reduce').addEventListener('change', e => { document.getElementById('grid').classList.toggle('reduce', e.target.checked); });
</script>
</body>
</html>
